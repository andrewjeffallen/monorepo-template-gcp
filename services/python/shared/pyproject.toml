[project]
name = "shared"
version = "0.1.0"
description = "Shared Python utilities for Moose Labs services"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]

# GCP client libraries - add as needed
gcp = [
    "google-cloud-firestore>=2.14.0",
    "google-cloud-pubsub>=2.19.0",
    "google-cloud-storage>=2.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shared"]
