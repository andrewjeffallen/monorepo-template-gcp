[package]
name = "trade_optimizer"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "High-performance trade and battery optimization engine with Python bindings"

[lib]
name = "trade_optimizer"
crate-type = ["cdylib", "rlib"]

[dependencies]
# PyO3 for Python bindings
pyo3 = { version = "0.22", features = ["extension-module"] }

# Numerical computing
ndarray = "0.16"
numpy = "0.22"  # PyO3 numpy integration

# Optimization
argmin = "0.10"
argmin-math = { version = "0.4", features = ["ndarray_latest-serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"

# Parallelism
rayon = "1.10"

[dev-dependencies]
approx = "0.5"
criterion = "0.5"

[[bench]]
name = "optimizer_bench"
harness = false

[profile.release]
lto = true
codegen-units = 1
