# Deploy workflow
# Builds Docker images, wheels, and validates infrastructure.
#
# Nothing is pushed, applied, or published unless the repository variable
# ENABLE_DEPLOY is set to 'true' (Settings -> Secrets and variables -> Actions
# -> Variables). Without it, every job still runs as a dry run so the full
# pipeline is exercised, but no GCP authentication or deployment happens.
# This file is identical in the public template and in private repos created
# from it; only the repo variable and secrets differ.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - prod
      services:
        description: 'Services to deploy (comma-separated, or "all")'
        required: false
        default: 'all'

env:
  GCP_REGION: us-central1

jobs:
  # ===========================================================================
  # Determine what changed
  # ===========================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.changes.outputs.python }}
      rust: ${{ steps.changes.outputs.rust }}
      libs: ${{ steps.changes.outputs.libs }}
      infra: ${{ steps.changes.outputs.infra }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            python:
              - 'services/python/**'
            rust:
              - 'services/rust/**'
            libs:
              - 'libs/**'
            infra:
              - 'infra/**'

  # ===========================================================================
  # Build (and, if ENABLE_DEPLOY, push) Python services
  # ===========================================================================
  build-python:
    name: Build Python Services
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: vars.ENABLE_DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: vars.ENABLE_DEPLOY == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: vars.ENABLE_DEPLOY == 'true'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Resolve image name
        id: image
        env:
          ENABLE_DEPLOY: ${{ vars.ENABLE_DEPLOY }}
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/moose-labs-${{ github.event.inputs.environment || 'dev' }}
        run: |
          if [ "$ENABLE_DEPLOY" = "true" ]; then
            echo "name=$REGISTRY/example-api" >> "$GITHUB_OUTPUT"
          else
            echo "name=example-api" >> "$GITHUB_OUTPUT"
          fi

      - name: Build example-api (push only if ENABLE_DEPLOY)
        uses: docker/build-push-action@v5
        with:
          context: services/python
          file: services/python/example-api/Dockerfile
          push: ${{ vars.ENABLE_DEPLOY == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  # ===========================================================================
  # Build (and, if ENABLE_DEPLOY, push) Rust services
  # ===========================================================================
  build-rust:
    name: Build Rust Services
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        if: vars.ENABLE_DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: vars.ENABLE_DEPLOY == 'true'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: vars.ENABLE_DEPLOY == 'true'
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev

      - name: Resolve image name
        id: image
        env:
          ENABLE_DEPLOY: ${{ vars.ENABLE_DEPLOY }}
          REGISTRY: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/moose-labs-${{ github.event.inputs.environment || 'dev' }}
        run: |
          if [ "$ENABLE_DEPLOY" = "true" ]; then
            echo "name=$REGISTRY/example-service" >> "$GITHUB_OUTPUT"
          else
            echo "name=example-service" >> "$GITHUB_OUTPUT"
          fi

      - name: Build example-service (push only if ENABLE_DEPLOY)
        uses: docker/build-push-action@v5
        with:
          context: services/rust
          file: services/rust/example-service/Dockerfile
          push: ${{ vars.ENABLE_DEPLOY == 'true' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest

  # ===========================================================================
  # Build hybrid library wheels (artifacts only; no external credentials)
  # ===========================================================================
  build-libs:
    name: Build Library Wheels
    runs-on: ${{ matrix.os }}
    needs: changes
    if: needs.changes.outputs.libs == 'true' || github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: libs/trade-optimizer
          args: --release --out dist --find-interpreter
          sccache: 'true'
          manylinux: auto

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: libs/trade-optimizer/dist

  # Publish wheels to PyPI (only on tags, and only when ENABLE_DEPLOY)
  publish-libs:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build-libs
    if: vars.ENABLE_DEPLOY == 'true' && startsWith(github.ref, 'refs/tags/trade-optimizer-')
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

  # ===========================================================================
  # Infrastructure: validate always, plan/apply only if ENABLE_DEPLOY
  # ===========================================================================
  deploy-infra:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.infra == 'true' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      # Dry run (public template): validate only, no credentials or state needed
      - name: Tofu Validate (dry run)
        if: vars.ENABLE_DEPLOY != 'true'
        working-directory: infra/environments/${{ github.event.inputs.environment || 'dev' }}
        run: |
          tofu init -backend=false
          tofu validate

      # Real deploy (private repos with ENABLE_DEPLOY=true)
      - name: Authenticate to Google Cloud
        if: vars.ENABLE_DEPLOY == 'true'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Tofu Init
        if: vars.ENABLE_DEPLOY == 'true'
        working-directory: infra/environments/${{ github.event.inputs.environment || 'dev' }}
        run: tofu init

      - name: Tofu Plan
        if: vars.ENABLE_DEPLOY == 'true'
        working-directory: infra/environments/${{ github.event.inputs.environment || 'dev' }}
        run: tofu plan -var="project_id=${{ secrets.GCP_PROJECT_ID }}" -out=tfplan

      - name: Tofu Apply
        if: vars.ENABLE_DEPLOY == 'true'
        working-directory: infra/environments/${{ github.event.inputs.environment || 'dev' }}
        run: tofu apply -auto-approve tfplan
