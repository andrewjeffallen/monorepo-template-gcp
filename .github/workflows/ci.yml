# Continuous Integration workflow
# Runs on all pull requests and pushes to main

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ===========================================================================
  # Python CI
  # ===========================================================================
  python-lint:
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: services/python
        run: uv sync --all-packages --all-extras

      - name: Run Ruff linter
        working-directory: services/python
        run: uv run ruff check .

      - name: Run Ruff formatter check
        working-directory: services/python
        run: uv run ruff format --check .

  python-test:
    name: Python Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        working-directory: services/python
        run: uv sync --all-packages --all-extras

      - name: Run tests
        working-directory: services/python
        run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: services/python/coverage.xml
          fail_ci_if_error: false

  # ===========================================================================
  # Rust CI
  # ===========================================================================
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust

      - name: Run clippy
        working-directory: services/rust
        run: cargo clippy -- -D warnings

      - name: Check formatting
        working-directory: services/rust
        run: cargo fmt --check

  rust-test:
    name: Rust Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust

      - name: Run tests
        working-directory: services/rust
        run: cargo test

  rust-build:
    name: Rust Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/rust

      - name: Build release
        working-directory: services/rust
        run: cargo build --release

  # ===========================================================================
  # Hybrid Rust+Python Libraries (Maturin)
  # ===========================================================================
  libs-lint:
    name: Libs Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/trade-optimizer

      - name: Run Rust clippy
        working-directory: libs/trade-optimizer
        run: cargo clippy -- -D warnings

      - name: Check Rust formatting
        working-directory: libs/trade-optimizer
        run: cargo fmt --check

      - name: Run Ruff on Python code
        working-directory: libs/trade-optimizer
        run: |
          uvx ruff check python
          uvx ruff format --check python

  libs-test:
    name: Libs Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python ${{ matrix.python-version }} virtualenv
        working-directory: libs/trade-optimizer
        run: |
          uv venv --python ${{ matrix.python-version }}
          echo "VIRTUAL_ENV=$PWD/.venv" >> "$GITHUB_ENV"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: libs/trade-optimizer

      - name: Run Rust tests
        working-directory: libs/trade-optimizer
        run: cargo test

      - name: Install maturin and test dependencies
        working-directory: libs/trade-optimizer
        run: uv pip install maturin pytest pytest-benchmark hypothesis pandas polars numpy

      - name: Build and install with maturin
        working-directory: libs/trade-optimizer
        run: maturin develop --release

      - name: Run Python tests
        working-directory: libs/trade-optimizer
        run: pytest tests -v

  libs-build:
    name: Build Wheels
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: libs/trade-optimizer
          args: --release --out dist --find-interpreter
          sccache: 'true'

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: libs/trade-optimizer/dist

  # ===========================================================================
  # Infrastructure validation
  # ===========================================================================
  tofu-validate:
    name: OpenTofu Validate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [dev, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.6.0"

      - name: Tofu Init
        working-directory: infra/environments/${{ matrix.environment }}
        run: tofu init -backend=false

      - name: Tofu Validate
        working-directory: infra/environments/${{ matrix.environment }}
        run: tofu validate

      - name: Tofu Format Check
        working-directory: infra/environments/${{ matrix.environment }}
        run: tofu fmt -check -recursive
